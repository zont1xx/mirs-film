spring.application.name=mirs-film

# Defaults match docker-compose.yml at the repo root; override with env vars outside local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mirsfilm}
spring.datasource.username=${DB_USER:mirsfilm}
spring.datasource.password=${DB_PASSWORD:mirsfilm}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep DB access inside the service layer instead of during view rendering.
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
